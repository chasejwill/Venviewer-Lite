allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    # ESLint's current minimatch 3 dependency cannot consume brace-expansion 5.
    # It only processes repository-controlled lint globs, not user input.
    - GHSA-mh99-v99m-4gvg
overrides:
  effect: 3.22.1
  postcss: 8.5.25
  sharp: 0.35.3
